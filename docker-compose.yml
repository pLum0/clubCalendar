services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/node_modules
      - static_volume:/app/staticfiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c '
      if [ "$$USE_NGINX_PROXY" = "true" ] && [ -z "$$VIRTUAL_HOST" ]; then
        echo ""; echo "  ERROR: USE_NGINX_PROXY is set but docker-compose.proxy.yml not loaded."; echo "  Use: just up"; echo "";
        exit 1;
      fi;
      exec gunicorn --bind 0.0.0.0:8000 calendar_project.wsgi:application'

volumes:
  static_volume:
  postgres_data:
